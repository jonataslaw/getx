#The name of your workflow.
name: build
# Trigger the workflow on push or pull request
on:
  push:
    branches: [master, latest-getx5-RC, getx5-rc-stabilize]
  pull_request:
    branches: [master, latest-getx5-RC]
  workflow_dispatch:
#A workflow run is made up of one or more jobs. Jobs run in parallel by default.
jobs:
  test:
    #The type of machine to run the job on. [windows,macos, ubuntu , self-hosted]
    defaults:
      run:
        working-directory: ./
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.47.8", "3.47.9"]
    #sequence of tasks called
    steps:
      # The branch or tag ref that triggered the workflow will be checked out.
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4
      # Setup a flutter environment.
      # https://github.com/marketplace/actions/flutter-action
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib test
      # run  flutter widgets tests  and unit tests
      - run: flutter test --coverage
      - run: flutter test --platform chrome test/documentation/public_imports_test.dart test/rx/rx_workers_test.dart
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter pub get
        working-directory: example_nav2
      - run: flutter analyze --no-fatal-infos lib test
        working-directory: example_nav2
      - run: flutter test
        working-directory: example_nav2
      - run: flutter build web --no-pub
        working-directory: example_nav2
      - run: flutter build web --no-pub --wasm
        working-directory: example_nav2
      # Upload coverage reports to Codecov
      # https://github.com/marketplace/actions/codecov
      - uses: codecov/codecov-action@v4
